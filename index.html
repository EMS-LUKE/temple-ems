<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0b5cad">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="煙火勤務系統">
<title>鹿耳門聖母廟煙火勤務系統</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1 id="evName">鹿耳門聖母廟煙火勤務系統</h1>
  <button class="pill" id="who" type="button">設定呼號</button>
  <span class="pill" id="sync">單機模式</span>
</header>

<div id="alert" class="alert" hidden><button type="button" id="alertOpen"><b id="alertText"></b><span>點這裡查看</span></button><button type="button" id="alertNo" aria-label="關閉提醒">✕</button></div>

<main>
  <section id="v-map">
    <div id="map"></div>
    <div id="gps" class="gps">定位中…</div>
    <div id="nav" class="navbox" hidden><div id="navArrow" class="arrow" aria-hidden="true">↑</div><button type="button" id="navOpen" class="navmain"><b id="navText"></b><span id="navDist"></span><small id="navMode"></small></button><button type="button" id="navStop" class="btn" aria-label="結束導引">✕</button></div>
    <div class="fabs">
      <button type="button" class="fab" id="locate" aria-label="回到我的位置">◎</button>
      <button type="button" class="fab" data-codeopen="1">位置碼</button>
      <button type="button" class="fab go" id="here">＋ 我的位置建案</button>
    </div>
    <div class="bar" id="bar" hidden></div>
  </section>

  <section id="v-list" class="scroll" hidden><div class="list" id="list"></div></section>

  <section id="v-stat" class="scroll" hidden>
    <div class="col">
      <div class="stats" id="stats"></div>
      <div id="byzone" class="muted"></div>
      <div class="rowb">
        <button class="btn go" id="copy" type="button">複製案件（貼到 Excel）</button>
        <button class="btn" id="dl" type="button">下載 CSV</button>
      </div>
      <textarea id="csv" rows="5" readonly hidden aria-label="案件資料"></textarea>
      <h2>離線底圖</h2>
      <p class="muted" id="tileInfo">尚未下載。</p>
      <button class="btn go" id="getTiles" type="button">下載廟區離線底圖</button>
      <p class="muted">請在訊號良好的地方（出勤前、家裡 Wi-Fi）按一次，每支手機都要各自下載。</p>

      <h2>分區</h2>
      <p class="muted" id="cellInfo"></p>

      <h2>同步</h2>
      <label class="l" for="teamInput">勤務代碼（全隊輸入同一組，6 碼以上英數字）</label>
      <input type="text" id="teamInput" maxlength="40" autocomplete="off" autocapitalize="off" placeholder="例：luermen2027a">
      <button class="btn" id="saveTeam" type="button">儲存勤務代碼</button>
      <p class="muted" id="teamInfo"></p>

      <h2>過去活動</h2>
      <div id="pastEv" class="col"></div>

      <details class="admin">
        <summary>管理員功能（一般隊員請勿操作）</summary>
        <div class="col">
          <p class="warnbox">以下操作會影響全隊所有手機，僅限管理員使用。</p>
          <button class="btn danger" id="newEv" type="button">開始新活動（僅限管理員，非管理員請勿按）</button>
          <p class="muted">目前的案件會移到「過去活動」，全隊畫面歸零。可以從「過去活動」切回來。</p>
          <button class="btn danger" id="purgeCancel" type="button">刪除所有已取消的案件</button>
          <button class="btn" id="calib" type="button">校正分區（在地圖上點三個角）</button>
          <button class="btn danger" id="resetGrid" type="button">還原成預設分區位置</button>
          <div class="zedit" id="zedit"></div>
          <button class="btn" id="saveZ" type="button">儲存區名</button>
        </div>
      </details>
      <p class="muted">活動名稱固定為「鹿耳門聖母廟煙火勤務系統」。</p>
      <p class="muted">底圖來源：內政部國土測繪中心。</p>
    </div>
  </section>
</main>

<nav>
  <button type="button" data-tab="map" aria-current="true">地圖</button>
  <button type="button" data-tab="list" aria-current="false">案件 <span id="nAct"></span></button>
  <button type="button" data-tab="stat" aria-current="false">統計・設定</button>
</nav>

<div class="sheet" id="sheet" hidden><div class="in" id="sheetIn"></div></div>
<div id="toast" hidden role="status"></div>

<script src="leaflet.js"></script>
<script src="firebase-app-compat.js"></script>
<script src="firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
