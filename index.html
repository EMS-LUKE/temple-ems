<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#10233b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="煙火勤務系統">
<title>鹿耳門聖母廟煙火勤務系統</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1 id="evName">鹿耳門聖母廟煙火勤務系統</h1>
  <button class="pill" id="who" type="button">設定呼號</button>
  <span class="pill" id="sync">單機模式</span>
</header>

<div id="alert" class="alert" hidden><button type="button" id="alertOpen"><b id="alertText"></b><span>點這裡查看</span></button><button type="button" id="alertNo" aria-label="關閉提醒">✕</button></div>

<main>
  <section id="v-map">
    <div id="map"></div>
    <div id="gps" class="gps">定位中…</div>
    <div id="nav" class="navbox" hidden><div id="navArrow" class="arrow" aria-hidden="true">↑</div><button type="button" id="navOpen" class="navmain"><b id="navText"></b><span id="navDist"></span><small id="navMode"></small></button><button type="button" id="navStop" class="btn" aria-label="結束導引">✕</button></div>
    <div class="fabs">
      <button type="button" class="fab" id="locate" aria-label="回到我的位置"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>
      <button type="button" class="fab" data-codeopen="1"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M9 3v18M15 3v18M3 9h18M3 15h18"/></svg>位置碼</button>
      <button type="button" class="fab go" id="here"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>在我的位置建立案件</button>
    </div>
    <div class="bar" id="bar" hidden></div>
  </section>

  <section id="v-list" class="scroll" hidden><div class="list" id="list"></div></section>

  <section id="v-stat" class="scroll" hidden>
    <div class="col">
      <div class="stats" id="stats"></div>
      <div id="byzone" class="muted"></div>
      <div class="rowb">
        <button class="btn go" id="copy" type="button">複製案件（貼到 Excel）</button>
        <button class="btn" id="dl" type="button">下載 CSV</button>
      </div>
      <textarea id="csv" rows="5" readonly hidden aria-label="案件資料"></textarea>
      <h2>離線底圖</h2>
      <p class="muted" id="tileInfo">尚未下載。</p>
      <button class="btn go" id="getTiles" type="button">下載廟區離線底圖</button>
      <p class="muted">請在訊號良好的地方（出勤前、家裡 Wi-Fi）按一次，每支手機都要各自下載。</p>

      <h2>分區</h2>
      <p class="muted" id="cellInfo"></p>

      <h2>同步</h2>
      <label class="l" for="teamInput">勤務代碼（全隊輸入同一組，6 碼以上英數字）</label>
      <input type="text" id="teamInput" maxlength="40" autocomplete="off" autocapitalize="off" placeholder="例：luermen2027a">
      <button class="btn" id="saveTeam" type="button">儲存勤務代碼</button>
      <p class="muted" id="teamInfo"></p>

      <h2>過去活動</h2>
      <div id="pastEv" class="col"></div>

      <details class="admin">
        <summary>管理員功能（一般隊員請勿操作）</summary>
        <div class="col">
          <p class="warnbox">以下操作會影響全隊所有手機，僅限管理員使用。</p>
          <button class="btn danger" id="newEv" type="button">開始新活動（僅限管理員，非管理員請勿按）</button>
          <p class="muted">目前的案件會移到「過去活動」，全隊畫面歸零。可以從「過去活動」切回來。</p>
          <button class="btn danger" id="purgeCancel" type="button">刪除所有已取消的案件</button>
          <button class="btn" id="calib" type="button">校正分區（在地圖上點三個角）</button>
          <button class="btn danger" id="resetGrid" type="button">還原成預設分區位置</button>
          <div class="zedit" id="zedit"></div>
          <button class="btn" id="saveZ" type="button">儲存區名</button>
        </div>
      </details>
      <h2>系統版本</h2>
      <p class="muted" id="verInfo"></p>
      <button class="btn" id="updNow" type="button">檢查更新</button>
      <p class="muted">系統會自動更新。如果這支手機的畫面跟別人不一樣，按這裡手動更新。</p>
      <p class="muted">活動名稱固定為「鹿耳門聖母廟煙火勤務系統」。</p>
      <p class="muted">底圖來源：內政部國土測繪中心。</p>
    </div>
  </section>
</main>

<nav>
  <button type="button" data-tab="map" aria-current="true"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M9 4 3 6.5v13.5L9 17.5l6 2.5 6-2.5V4l-6 2.5z"/><path d="M9 4v13.5M15 6.5V20"/></svg>地圖</button>
  <button type="button" data-tab="list" aria-current="false"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="4" y="3.5" width="16" height="17" rx="2.5"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>案件<span id="nAct" aria-label="進行中件數"></span></button>
  <button type="button" data-tab="stat" aria-current="false"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h9M17 7h3M4 12h3M11 12h9M4 17h11M19 17h1"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="17" r="2"/></svg>統計・設定</button>
</nav>

<div class="sheet" id="sheet" hidden><div class="in" id="sheetIn"></div></div>
<div id="toast" hidden role="status"></div>

<script src="leaflet.js"></script>
<script src="firebase-app-compat.js"></script>
<script src="firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
